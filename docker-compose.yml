services:
  mock:
    build: .
    command:
      ["uvicorn", "mock_service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DOWNSTREAM_FAILURE_RATE: "0.20"
    ports: ["8001:8001"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  inference:
    build: .
    environment:
      DOWNSTREAM_URL: http://mock:8001
      DB_PATH: /app/data/dlq.sqlite3
    ports: ["8000:8000"]
    volumes: ["dlq-data:/app/data"]
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dlq-data:
